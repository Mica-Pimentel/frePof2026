<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>freiProf · Visão ao vivo</title>
  <meta name="description" content="Reconhecimento de mãos, rosto, corpo e objetos pela webcam, direto no navegador.">
  <meta name="color-scheme" content="light dark">
  <meta name="author" content="MPTech">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%233b5bfd'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=9">
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita "piscar").
    try { const t = localStorage.getItem("frepof-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js?v=9"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#"><span class="brand-dot"></span>frePof</a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Modos"></nav>
    <button class="icon-btn" id="themeBtn" title="Alternar tema claro/escuro" aria-label="Alternar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="stage-col">
      <div class="stage mirrored" id="stage">
        <div class="stage-inner">
          <video id="webcam" playsinline muted></video>
          <canvas id="drawCanvas"></canvas>
          <canvas id="overlay"></canvas>
        </div>

        <div class="stage-empty" id="emptyState">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.55-2.28A1 1 0 0 1 21 8.62v6.76a1 1 0 0 1-1.45.9L15 14"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
          </div>
          <p class="empty-title">Câmera desligada</p>
          <p class="empty-sub">Tudo é processado aqui no seu navegador — nenhuma imagem sai do seu computador.</p>
          <button class="btn primary" id="startBtn">Ativar câmera</button>
          <p class="empty-credit">Desenvolvido por <strong>MPTech</strong></p>
        </div>

        <div class="stage-loading" id="loading" hidden>
          <span class="spinner"></span><span id="loadingText">Carregando modelo…</span>
        </div>

        <div class="stage-hud" id="hud" hidden>
          <span class="pill" id="fpsPill">— fps</span>
          <span class="pill" id="msPill">— ms</span>
          <span class="pill" id="devPill" hidden>GPU</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="camBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18.4 6.6a9 9 0 1 1-12.8 0M12 2v10" stroke-linecap="round"/></svg>
          <span>Desligar</span>
        </button>
        <button class="btn" id="qualityBtn" title="Qualidade da câmera: Rápida (640×480) ou HD (1280×720)">
          <b class="q-badge" id="qualityBadge">SD</b>
          <span id="qualityLabel">Rápida</span>
        </button>
        <button class="btn" id="flipBtn" hidden title="Trocar câmera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3.5l-2-2.5h-5L7.5 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2M14.5 9.5V11H13M9.5 16.5V15H11"/></svg>
          <span>Trocar</span>
        </button>
        <select class="select" id="cameraSelect" aria-label="Escolher câmera" disabled>
          <option>Câmera padrão</option>
        </select>
        <label class="switch" title="Espelhar"><input type="checkbox" id="mirrorToggle" checked><span class="knob"></span>
          <svg class="m-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7 3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg>
          <span class="lbl">Espelhar</span></label>
        <label class="switch" title="Mostrar detecção"><input type="checkbox" id="overlayToggle" checked><span class="knob"></span>
          <svg class="m-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="lbl">Mostrar detecção</span></label>
        <span class="spacer"></span>
        <button class="btn" id="shotBtn" disabled title="Salvar foto (S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Foto</span>
        </button>
      </div>
    </section>

    <aside class="panel" id="panel">
      <button class="sheet-handle" id="sheetHandle" type="button" aria-label="Expandir painel" aria-expanded="false"><span></span></button>
      <div class="panel-head" id="panelHead">
        <h1 id="modeTitle">—</h1>
        <p id="modeHint"></p>
      </div>
      <div id="modePanel" class="section-wrap"></div>
      <div class="credit panel-credit">Desenvolvido por <strong>MPTech</strong></div>
    </aside>
  </main>

  <footer class="foot">
    <span class="keys">Atalhos: <kbd>1</kbd>–<kbd>5</kbd> trocar modo · <kbd>Espaço</kbd> câmera · <kbd>S</kbd> foto · </span>
    MediaPipe Tasks Vision <span id="mpVersion"></span>
    <div class="credit">Desenvolvido por <strong>MPTech</strong></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
